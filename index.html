:root{color-scheme:light dark;

@keyframes draw{to{stroke-dashoffset:0}}
/* business */
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.widget{background:var(--card);border-radius:20px;padding:14px;display:grid;gap:4px;box-shadow:var(--shadow)}
.widget span{font-size:13px;color:var(--sec);display:flex;gap:6px;align-items:center}.widget span svg{width:16px;height:16px}
.widget b{font-size:24px;font-weight:700;white-space:nowrap;letter-spacing:-.3px}
.widget.hero2{grid-column:1/-1;background:linear-gradient(135deg,#0a6c7a,#0b3d5c);color:#fff}.widget.hero2 span{color:rgba(255,255,255,.8)}.widget.hero2 b{font-size:32px}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px}
.chart i{flex:1;background:rgba(255,255,255,.85);border-radius:4px 4px 2px 2px;min-height:3px}
.chart.dark i{background:var(--tint)}
.st{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.st.booked{background:light-dark(#fff3d6,#3a2b06);color:var(--orange)}.st.confirmed{background:var(--tintbg);color:var(--tint)}.st.driver{background:light-dark(#ece6ff,#251c45);color:light-dark(#5e3fd1,#b5a2ff)}.st.done{background:light-dark(#e3f6e8,#10301a);color:var(--green)}.st.cancelled{background:light-dark(#ffe9e5,#3a1712);color:var(--red)}
.qrcard{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.qrcard .q{background:#fff;border-radius:10px;padding:6px}.qrcard .q svg{width:100%;height:auto;display:block}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .t{width:78px;height:78px;border-radius:10px;overflow:hidden;position:relative}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:3px;inset-inline-end:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px}
.upload{width:78px;height:78px;border-radius:10px;border:1.5px dashed var(--ter);display:grid;place-items:center;color:var(--tint)}
.upload svg{width:26px;height:26px}
.toast{position:absolute;top:calc(14px + var(--safe-t));left:50%;transform:translate(-50%,-140%);z-index:60;background:var(--card);color:var(--label);box-shadow:0 10px 30px rgba(0,0,0,.2);border-radius:22px;padding:10px 16px;font-size:15px;font-weight:500;transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;gap:8px;align-items:center;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.chat{display:grid;gap:8px}
.msg{padding:9px 13px;border-radius:18px;max-width:82%;white-space:pre-wrap;font-size:16px;line-height:1.35}
.msg.u{background:var(--tint);color:#fff;justify-self:end;border-bottom-right-radius:5px}
.msg.a{background:var(--card);border-bottom-left-radius:5px}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;color:var(--sec);padding:50px 30px}
.empty svg{width:54px;height:54px;color:var(--ter)}
.note{font-size:12.5px;color:var(--sec);padding:10px 16px}
.press{transition:transform .15s}.press:active{transform:scale(.97)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}html,body{background:#fff!important;color:#000!important;height:auto;overflow:visible}}
.inv{font:14px/1.5 -apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif;color:#000;background:#fff;padding:28px;max-width:760px;margin:0 auto}.inv .ih{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #0a6c7a;padding-bottom:14px;margin-bottom:16px}.inv .ib{margin-bottom:16px}.inv table{width:100%;border-collapse:collapse}.inv th,.inv td{padding:8px 6px;border-bottom:1px solid #ddd;text-align:start}.inv thead th{background:#eef6f7}.inv tfoot td{border:0}.inv .note2{margin-top:18px;color:#444;font-size:12px}
</style>
